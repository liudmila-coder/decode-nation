name: Discover AMAC event photo URLs

on:
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Inspect public event gallery
        run: |
          cat > /tmp/discover.py <<'PY'
          from playwright.sync_api import sync_playwright
          from urllib.parse import urljoin
          import re
          target="https://eventgallery.triumphphotobooth.com/92426-AMAC"
          seen=set()
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              page=browser.new_page(viewport={"width":1400,"height":1000})
              page.on("response", lambda r: seen.add(r.url) if ("image" in (r.headers.get("content-type","")) or re.search(r"\.(?:jpe?g|png|webp)(?:\?|$)", r.url, re.I)) else None)
              page.goto(target, wait_until="domcontentloaded", timeout=120000)
              page.wait_for_timeout(5000)
              for _ in range(15):
                  page.mouse.wheel(0,3000)
                  page.wait_for_timeout(700)
              for img in page.locator("img").all():
                  for attr in ("src","data-src","srcset","data-srcset"):
                      val=img.get_attribute(attr)
                      if val:
                          for bit in val.split(","):
                              u=bit.strip().split(" ")[0]
                              if u: seen.add(urljoin(page.url,u))
              html=page.content()
              for m in re.findall(r'https?://[^"\'<> ]+', html):
                  if re.search(r'AMAC|jpe?g|png|webp',m,re.I): seen.add(m)
              print("TITLE:",page.title())
              print("URL:",page.url)
              print("CANDIDATES")
              for u in sorted(seen):
                  print(u)
              browser.close()
          PY
          python /tmp/discover.py
