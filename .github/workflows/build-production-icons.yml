name: Install production woman icons

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-production-icons.yml"
      - ".tmp/walking.b64"
      - ".tmp/phone.001.b64"
      - ".tmp/phone.002.b64"

permissions:
  contents: write

jobs:
  install-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore exact production assets
        run: |
          tr -d '\n\r ' < .tmp/walking.b64 | base64 --decode > assets/icon-walking-woman-production.webp
          cat .tmp/phone.001.b64 .tmp/phone.002.b64 | tr -d '\n\r ' | base64 --decode > assets/icon-phone-woman-production.webp
          echo "walking sha1: $(sha1sum assets/icon-walking-woman-production.webp)"
          echo "phone sha1: $(sha1sum assets/icon-phone-woman-production.webp)"
          test "$(sha1sum assets/icon-walking-woman-production.webp | cut -d' ' -f1)" = "4ec9fbdbaccaad795d6bb5a001f51fb6202dd2eb"
          test "$(sha1sum assets/icon-phone-woman-production.webp | cut -d' ' -f1)" = "3a66bdd9bc9d2828fba8bf80dc8ce929f8270270"

      - name: Verify dimensions and alpha
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          checks = [
              ("assets/icon-walking-woman-production.webp", (168,168)),
              ("assets/icon-phone-woman-production.webp", (144,432)),
          ]
          for path, expected in checks:
              im = Image.open(path)
              assert im.size == expected, (path, im.size)
              assert "A" in im.getbands(), (path, im.mode)
              print(path, im.size, im.mode)
          PY

      - name: Update only image sources
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          old_walk='/assets/icon-walking-woman-hq.webp'
          old_phone='/assets/icon-phone-woman-hq.webp'
          if old_walk not in s:
              old_walk='/assets/icon-walking-woman-production.webp?v=20261016-1'
          if old_phone not in s:
              old_phone='/assets/icon-phone-woman-production.webp?v=20261016-1'
          s=s.replace(old_walk,'/assets/icon-walking-woman-production.webp?v=20261016-2',1)
          s=s.replace(old_phone,'/assets/icon-phone-woman-production.webp?v=20261016-2',1)
          p.write_text(s,encoding="utf-8")
          PY

      - name: Commit assets and HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/icon-walking-woman-production.webp assets/icon-phone-woman-production.webp index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Use production woman icons in Next and Contact"
            git push origin main
          fi
