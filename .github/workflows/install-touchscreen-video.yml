name: Install touchscreen station video

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/install-touchscreen-video.yml"
      - ".tmp/video.*.b64"

permissions:
  contents: write

jobs:
  install-video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore touchscreen video
        run: |
          cat .tmp/video.0.b64 .tmp/video.1.b64 .tmp/video.2.b64 .tmp/video.3.b64 .tmp/video.4.b64 .tmp/video.5.b64 .tmp/video.6.b64 \
            | tr -d '\n\r ' | base64 --decode > assets/essential-station-touchscreen.mp4
          test -s assets/essential-station-touchscreen.mp4
          file assets/essential-station-touchscreen.mp4 | grep -q "ISO Media, MP4"

      - name: Commit video asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/essential-station-touchscreen.mp4
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add touchscreen station video"
            git push origin main
          fi
